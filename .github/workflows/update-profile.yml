name: Update profile widgets

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/generate_profile.py
        env:
          # PROFILE_TOKEN is optional: without it private contributions are not counted.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || { git commit -m "Update profile widgets" && git push; }
